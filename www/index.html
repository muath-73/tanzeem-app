<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="application-name" content="تنظيم">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تنظيم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>تنظيم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/slides.js"></script>
<style>
/* Three screens in one page: Home (course cards) -> Course (its chapters, numbered, each with its own upload or start button) -> Study (the slide, tap a term to translate, ask the AI for questions). Single light theme by choice: it follows the supplied "Academic Intelligence" design system, which defines light tokens only. */
:root {
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --line: #E2E8F0;
  --line-2: #CBD5E1;
  --chip: #F1F5F9;
  --zone: #F4F6FB;
  --ink: #0F172A;
  --muted: #475569;
  --faint: #64748B;
  --on-fill: #FFFFFF;
  --primary: #2563EB;
  --primary-hover: #1D4ED8;
  --primary-soft: #EFF6FF;
  --primary-line: #BFDBFE;
  --ai: #6366F1;
  --ai-ink: #4338CA;
  --ai-soft: #EEF2FF;
  --ai-line: #C7D2FE;
  --ai-mark: #E0E7FF;
  --ai-dot: #818CF8;
  --ai-from: #4F46E5;
  --ai-to: #7C3AED;
  --ok: #059669;
  --ok-ink: #065F46;
  --ok-soft: #ECFDF5;
  --bad: #DC2626;
  --bad-ink: #991B1B;
  --bad-soft: #FEF2F2;
  --pdf: #FEE2E2;
  --pdf-ink: #B91C1C;
  --toast: #283044;
  --s-bg: #FFFFFF;
  --s-ink: #1E293B;
  --s-title: #1E3A5F;
  --s-rule: #3B6EA8;
  --s-box: #F1F5F9;
  --s-box-line: #CBD5E1;
  --s-muted: #64748B;
  --s-arrow: #94A3B8;
  --s-foot-line: #E5EAF0;
  --f-ar: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --f-en: 'IBM Plex Sans', system-ui, 'Segoe UI', Arial, sans-serif;
  --e1: 0 1px 3px 0 rgba(15,23,42,.04), 0 1px 2px -1px rgba(15,23,42,.02);
  --e2: 0 4px 12px -2px rgba(37,99,235,.10), 0 2px 6px -2px rgba(15,23,42,.05);
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ar); font-size: 14px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }

/* shared top bar */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B1220; --card: #141C2E; --line: #25314A; --line-2: #33415C; --chip: #1C2638; --zone: #101828;
  --ink: #E8EDF5; --muted: #A9B4C6; --faint: #8592A8;
  --primary: #60A5FA; --primary-hover: #93C5FD; --primary-soft: #14233F; --primary-line: #27457A;
  --ai: #818CF8; --ai-ink: #C7D2FE; --ai-soft: #1B2145; --ai-line: #353E7A; --ai-mark: #2A3270; --ai-dot: #A5B4FC;
  --ok: #34D399; --ok-ink: #A7F3D0; --ok-soft: #0F2A24;
  --bad: #F87171; --bad-ink: #FECACA; --bad-soft: #301518;
  --pdf: #3A1A1D; --pdf-ink: #FCA5A5; --toast: #2B3550;
  --e1: 0 1px 3px 0 rgba(0,0,0,.35); --e2: 0 4px 12px -2px rgba(0,0,0,.45);
}
:root[data-theme="dark"] .slide { --ink:#0F172A; --muted:#475569; --faint:#64748B; --card:#FFFFFF; --chip:#F1F5F9; --line:#E2E8F0; --line-2:#CBD5E1; --ai:#6366F1; --ai-ink:#4338CA; --ai-soft:#EEF2FF; --ai-line:#C7D2FE; --ai-mark:#E0E7FF; --ai-dot:#818CF8; --primary:#2563EB; --primary-soft:#EFF6FF; --primary-line:#BFDBFE; color: var(--s-ink); }
:root[data-theme="dark"] .bar, :root[data-theme="dark"] .tabs-bot { background: rgba(11,18,32,.92); border-color: var(--line); }
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .avatar, :root[data-theme="dark"] .p-ico, :root[data-theme="dark"] .jump button[aria-current="true"] { background: #3B82F6; border-color: #3B82F6; color: #fff; }
:root[data-theme="dark"] .brand b { color: #E5C26A; }
:root[data-theme="dark"] .notes { background: var(--card); }
:root[data-theme="dark"] .tzb.warn { background: #2A1D0E; border-color: #7C4A12; }
:root[data-theme="dark"] .nb { background: #2A2410; border-color: #6B5A14; }
:root[data-theme="dark"] .resume .btn { background: var(--card); color: #C7D2FE; border-color: var(--card); }
:root[data-theme="dark"] .inkbar .sw i { border-color: var(--card); }
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
.bar { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226,232,240,.8); }
.bar-in { max-width: 1120px; margin-inline: auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.logo { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #0B3B2E; color: #E5C26A; box-shadow: 0 2px 8px rgba(11,59,46,.25); }
.logo svg { width: 26px; height: 26px; }
.brandrow { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.brand b { font: 700 22px/26px 'Reem Kufi', var(--f-ar); color: #0B3B2E; }
.brand small { font: 500 11px/14px var(--f-en); color: var(--faint); white-space: nowrap; }
.sp { flex: 1; }
.term { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 9999px; background: var(--chip); color: var(--muted); font: 500 12px/16px var(--f-ar); white-space: nowrap; }
.avatar { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--primary); color: var(--on-fill); }
.avatar svg { width: 18px; height: 18px; }
.back { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--chip); }
.back:hover { background: var(--line); }
.back svg { width: 20px; height: 20px; }
.crumb { min-width: 0; flex: 1; }
.crumb b { display: block; font: 600 15px/22px var(--f-ar); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb small { display: block; font: 500 12px/16px var(--f-ar); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { flex: none; direction: ltr; font: 600 13px/20px var(--f-en); font-variant-numeric: tabular-nums; color: var(--primary); background: var(--primary-soft); border: 1px solid var(--primary-line); border-radius: 9999px; padding: 4px 12px; }
.progress { height: 3px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--primary); border-radius: 9999px; transition: width .3s; }

/* shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font: 500 14px/20px var(--f-ar); transition: transform .08s, background .15s; }
.btn:hover:not(:disabled) { background: var(--chip); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-fill); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn.outline { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary); }
.btn.outline:hover:not(:disabled) { background: #DCEAFF; }
.btn.sm { min-height: 40px; padding: 0 14px; }
.link { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--primary); font: 500 13px/20px var(--f-ar); }
.link:hover { background: var(--primary-soft); }
.link svg { width: 16px; height: 16px; }
.err { margin: 6px 2px 0; font: 500 13px/20px var(--f-ar); color: var(--bad-ink); }
.badge { padding: 2px 10px; border-radius: 9999px; background: var(--chip); color: var(--muted); font: 500 12px/18px var(--f-ar); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok-ink); }
.badge.busy { background: var(--ai-soft); color: var(--ai-ink); }
.empty { margin: 0; padding: 14px; border: 1px dashed var(--line-2); border-radius: 12px; font: 400 14px/22px var(--f-ar); color: var(--muted); }
.empty-home { padding: 28px 20px; border: 1px dashed var(--line-2); border-radius: 16px; background: var(--card); text-align: center; }
.empty-home .btn { margin-top: 12px; }

/* home + course pages */
.page { max-width: 1120px; margin-inline: auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 28px; }
.page.narrow { max-width: 680px; }
.pg-h { font-size: 24px; line-height: 32px; }
.sec-h { margin: 0; font: 600 20px/28px var(--f-ar); }
.sec-p { margin: 2px 0 0; font: 400 13px/20px var(--f-ar); color: var(--faint); }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--e1); }
.hero-t { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero h1 { margin: 0; font: 600 26px/36px var(--f-ar); }
.pill { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 9999px; background: var(--primary-soft); border: 1px solid var(--primary-line); color: var(--primary); font: 600 12px/16px var(--f-ar); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); border-color: #A7F3D0; color: var(--ok-ink); }
.hero p { margin: 0; font: 400 15px/24px var(--f-ar); color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 14px; }
.course { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-width: 0; padding: 16px; text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--e1); transition: box-shadow .2s, transform .2s; }
.course:hover { transform: translateY(-2px); box-shadow: var(--e2); border-color: var(--primary-line); }
.c-top { display: flex; margin-bottom: 10px; }
.tag { max-width: 100%; padding: 3px 10px; border-radius: 9999px; background: var(--primary-soft); color: var(--primary); font: 500 12px/16px var(--f-ar); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-name { display: block; font: 600 16px/24px var(--f-ar); }
.c-code { display: block; min-height: 18px; margin-top: 2px; direction: ltr; text-align: right; font: 500 12px/18px var(--f-en); letter-spacing: .04em; color: var(--faint); }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--chip); color: var(--muted); font: 500 12px/16px var(--f-ar); }
.c-foot i { width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }

.backlink { align-self: flex-start; margin-bottom: -12px; }
.c-hero { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--e1); }
.p-ico { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; background: var(--primary); color: var(--on-fill); }
.p-ico svg { width: 24px; height: 24px; }
.p-t { flex: 1 1 240px; min-width: 0; }
.p-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.p-name h1 { margin: 0; font: 700 22px/30px var(--f-ar); }
.code { direction: ltr; padding: 1px 8px; border-radius: 6px; background: var(--line); color: var(--muted); font: 500 12px/18px var(--f-en); letter-spacing: .04em; }
.p-t p { margin: 2px 0 0; font: 400 13px/20px var(--f-ar); color: var(--faint); }
.c-sum { display: flex; gap: 8px; flex-wrap: wrap; }
.l-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

.chlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.chrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--e1); transition: border-color .15s, background .15s; }
.chrow.over { border-color: var(--primary); background: var(--primary-soft); }
.num { width: 56px; height: 56px; display: grid; place-content: center; justify-items: center; gap: 0; border-radius: 12px; background: var(--chip); color: var(--muted); }
.num small { font: 500 10px/12px var(--f-ar); }
.num b { font: 700 22px/26px var(--f-en); font-variant-numeric: tabular-nums; color: var(--ink); }
.chrow.ready .num { background: var(--primary-soft); color: var(--primary); }
.chrow.ready .num b { color: var(--primary); }
.chrow.busy .num { background: var(--ai-soft); color: var(--ai-ink); }
.ch-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ch-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ch-n { font: 600 16px/24px var(--f-ar); }
.ch-s { font: 400 13px/20px var(--f-ar); color: var(--faint); }
.ch-act { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.chrow .bar-p, .chrow .err { grid-column: 1 / -1; }
.bar-p { height: 6px; border-radius: 9999px; background: var(--line); overflow: hidden; }
.bar-p i { display: block; height: 100%; width: 0; border-radius: 9999px; background: linear-gradient(90deg, var(--ai), #8B5CF6); animation: fill 1.8s linear forwards; }
@keyframes fill { to { width: 100%; } }
.chrow.adding { border-color: var(--primary-line); }
.addf { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.addf .chnum, .renf .chnum { flex: 0 0 64px; min-width: 0; width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.addf input { flex: 1 1 180px; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
.addf input:focus, .fld input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
@media (max-width: 639px) { .chrow { grid-template-columns: auto minmax(0, 1fr); } .ch-act { grid-column: 1 / -1; justify-content: flex-start; } .ch-act .btn { flex: 1 1 auto; } }

.qx { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--chip); color: var(--muted); cursor: pointer; }
.qx:hover { color: var(--ink, inherit); }
/* note marker */
#notesTog { position: relative; }
#notesTog.has::after { content: ''; position: absolute; top: 7px; inset-inline-end: 7px; width: 9px; height: 9px; border-radius: 50%; background: #e11d48; box-shadow: 0 0 0 2px var(--card); }
/* free trial */
.tzb { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 400 14px/22px var(--f-ar); }
.tzb.warn { border-color: #FDBA74; background: #FFF7ED; }
.tzs .tzp { margin: 0 0 12px; font: 400 15px/26px var(--f-ar); color: var(--muted); }
.tzs .tzact { display: grid; gap: 8px; margin-top: 16px; }
#tzm { z-index: 60; }
/* add course sheet */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(15,23,42,.45); }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow: auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-radius: 20px 20px 0 0; }
@media (min-width: 560px) { .modal { align-items: center; padding: 16px; } .sheet { border-radius: 20px; padding-bottom: 20px; } }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.m-head h2 { margin: 0; font: 700 20px/28px var(--f-ar); }
.x { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--chip); }
.x svg { width: 18px; height: 18px; }
.fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.fld > span { font: 500 14px/20px var(--f-ar); }
.fld > span i { font-style: normal; font-weight: 400; color: var(--faint); margin-inline-start: 6px; }
.fld input { height: 46px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); }
.fld small { font: 400 12px/18px var(--f-ar); color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { min-height: 40px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: 9999px; background: var(--card); font: 500 14px/20px var(--f-ar); }
.fchip:hover { background: var(--chip); }
.fchip[aria-checked="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.m-act { display: flex; gap: 8px; margin-top: 4px; }
.req { color: #DC2626; font-weight: 700; }
.cpn { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cpn input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--card); color: var(--ink); font: 500 14px/20px var(--f-en); }
.m-act .primary { flex: 1; }
.toast { position: fixed; z-index: 60; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; padding: 12px 16px; border-radius: 12px; background: var(--toast); color: var(--on-fill); font: 500 14px/22px var(--f-ar); text-align: center; box-shadow: 0 8px 24px rgba(15,23,42,.25); }

/* study screen */
.stage { max-width: 1480px; margin-inline: auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.deck { display: flex; flex-direction: column; gap: 12px; min-width: 0; width: 100%; max-width: max(480px, calc((100vh - var(--ch, 230px)) * 1.7778)); margin-inline: auto; }
.side { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; min-width: 0; width: 100%; max-width: 600px; margin-inline: auto; }
.side.static { position: static; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 32px; }
.chip-ai { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9999px; background: var(--ai-soft); color: var(--ai-ink); border: 1px solid var(--ai-line); font: 500 12px/16px var(--f-ar); }
.chip-ai svg { width: 14px; height: 14px; color: var(--ai); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ai); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.hint { font: 400 12px/18px var(--f-ar); color: var(--faint); }

.slide { position: relative; overflow: clip; display: flex; flex-direction: column; container-type: inline-size; aspect-ratio: 16 / 9; width: 100%; max-width: max(480px, calc((100vh - var(--ch, 230px)) * 1.7778)); margin-inline: auto; background: var(--s-bg); color: var(--s-ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--e1); direction: ltr; text-align: left; font-family: var(--f-en); }
.s-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px 28px; align-content: start; padding: clamp(18px, 4.6cqw, 30px) clamp(18px, 4.6cqw, 32px) 12px; }
@container (min-width: 560px) { .s-body { grid-template-columns: minmax(0, 1fr) minmax(170px, 32%); } }
.s-title { margin: 0; font: 700 clamp(24px, 4.6cqw, 32px)/1.2 var(--f-en); color: var(--s-title); letter-spacing: -.01em; }
.s-title::after { content: ''; display: block; width: 44px; height: 3px; border-radius: 2px; background: var(--s-rule); margin-top: 12px; }
.s-list { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 14px; }

.w { cursor: pointer; border-bottom: 1.5px dotted var(--ai-dot); border-radius: 2px; transition: background .15s, border-color .3s; }

.scan::before { content: ''; position: absolute; left: 0; right: 0; top: -80px; height: 80px; background: linear-gradient(to bottom, rgba(99,102,241,0), rgba(99,102,241,.16)); border-bottom: 2px solid var(--ai); animation: sweep .95s cubic-bezier(.45, 0, .25, 1) forwards; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.notes { flex: 0 0 clamp(260px, 26vw, 330px); display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: #fff; border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--e1); min-height: 260px; }
.notes[hidden] { display: none; }
.notes .n-h { display: flex; align-items: center; gap: 8px; }

.notes textarea { flex: 1; width: 100%; min-height: 200px; resize: none; border: 0; outline: none; padding: 0; background: repeating-linear-gradient(transparent, transparent 31px, var(--line) 31px, var(--line) 32px); background-attachment: local; font: 400 16px/32px var(--f-ar); color: var(--ink); }
@media (max-width: 859px) { .work { flex-direction: column; } .work .slide { flex: none; width: 100%; align-self: center; } .notes { flex: none; } .deck.wn { max-width: max(480px, calc((100vh - var(--ch, 230px)) * 1.7778)); } }

.ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; }

.inkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }

.inkbar .sw[aria-pressed="true"] i { box-shadow: 0 0 0 3px var(--ai); }
.inkbar .sep { width: 1px; height: 28px; background: var(--line); margin-inline: 2px; }
.inkbar .ist { margin-inline-start: auto; font: 400 12px/18px var(--f-ar); color: var(--faint); }
.tools #inkTog[aria-pressed="true"] { background: var(--ai-soft); border-color: var(--ai); color: var(--ai-ink); font-weight: 600; }

.tools .ai { margin-inline-start: auto; }

.btn.ai { min-height: 48px; padding: 0 18px; border: 0; color: var(--on-fill); font-weight: 600; background: linear-gradient(135deg, var(--ai-from), var(--ai-to)); box-shadow: 0 4px 12px -2px rgba(79,70,229,.35); }
.btn.ai:hover:not(:disabled) { background: linear-gradient(135deg, #4338CA, #6D28D9); }
.sub-pill { padding: 2px 8px; border-radius: 9999px; background: rgba(255,255,255,.22); font: 500 11px/14px var(--f-ar); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 18px; box-shadow: var(--e2); }
.card.aiq { border-color: var(--ai-line); }
.ctx { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 10px; border-radius: 9999px; background: var(--primary-soft); border: 1px solid var(--primary-line); color: var(--primary); font: 500 12px/16px var(--f-ar); }

.en { margin-top: 14px; font: 500 13px/18px var(--f-en); color: var(--faint); letter-spacing: .02em; }

.mean.upsell { font-size: 14px; line-height: 22px; padding: 8px 10px; border-radius: 10px; background: var(--ai-soft); color: var(--ai-ink); }

.sent { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.lbl { margin-bottom: 4px; font: 500 12px/16px var(--f-ar); color: var(--faint); }
.sent p { margin: 0; font: 500 16px/26px var(--f-ar); }
.skel { display: grid; gap: 10px; }

.why { margin: 12px 0 0; font: 400 14px/22px var(--f-ar); color: var(--muted); }

.next { width: 100%; margin-top: 12px; }
.done { display: grid; gap: 6px; justify-items: start; margin-top: 4px; }
.score { direction: ltr; font: 700 44px/1 var(--f-en); font-variant-numeric: tabular-nums; color: var(--ai-ink); }

/* tabs */
.tabs-top { display: none; align-items: center; gap: 4px; margin-inline-start: 16px; }

/* real (image) slides */
.slide.imgs { display: block; background: #fff; }

.pic .w.gw.on, .pic .w.on, .pic .w.gw.on:hover { background: transparent; box-shadow: inset 0 -4px 0 var(--ai); }

/* search, resume, review, auth */

  /* ---------- study screen ---------- */
  function tokenize(text, terms) {
    var toks = text.split(' ').map(function (t) {
      var m = t.match(/^([(\[]*)(.*?)([,.:;)\]]*)$/);
      return { pre: m[1], core: m[2], post: m[3] };
    });
    var out = [], i = 0;
    while (i < toks.length) {
      var hit = false;
      for (var n = Math.min(3, toks.length - i); n >= 1 && !hit; n--) {
        var ok = true, cores = [];
        for (var j = 0; j < n; j++) {
          if (j > 0 && toks[i + j].pre) ok = false;
          if (j < n - 1 && toks[i + j].post) ok = false;
          cores.push(toks[i + j].core);
        }
        if (!ok) continue;
        var shown = cores.join(' '), key = shown.toLowerCase();
        if (terms[key]) {
          out.push(esc(toks[i].pre) + '<span class="w" role="button" tabindex="0" data-k="' + esc(key) + '">' + esc(shown) + '</span>' + esc(toks[i + n - 1].post));
          i += n; hit = true;
        }
      }
      if (!hit) {
        var tk = toks[i];
        if (/[A-Za-z]{2,}/.test(tk.core)) out.push(esc(tk.pre) + '<span class="w gw" role="button" tabindex="0" data-x="' + esc(tk.core.toLowerCase()) + '">' + esc(tk.core) + '</span>' + esc(tk.post));
        else out.push(esc(tk.pre + tk.core + tk.post));
        i++;
      }
    }
    return out.join(' ');
  }

  function curSlide() { return stu.deck[S.idx % stu.deck.length]; }

  function imgSlideHTML(s) {
    var h = '<div class="pic"><img src="' + s.img + '" alt="Slide ' + (S.idx + 1) + '" draggable="false">';

    });
    return h + '</div><div class="scan" aria-hidden="true"></div>';
  }
  function slideHTML(s) {

    h += '</ul></div><aside class="s-side">';

  function quizHTML() {
    var Q = curSlide().quiz || [], qz = S.quiz;
    var head = '<div class="q-head"><span class="q-title">' + I.spark + 'أسئلة من السلايد</span><button class="qx" type="button" data-act="back" aria-label="إغلاق"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
    var segs = '<div class="segs">' + Q.map(function (q, i) {
      var c = '';
      if (qz.picks[i] !== undefined) c = qz.picks[i] === q.a ? ' ok' : ' bad';

    }).join('') + '</div>';

    if (qz.phase === 'err') {
      body = '<p class="q-note">' + esc(qz.msg || '') + '</p><div class="row"><button class="btn primary" type="button" data-act="retry">إعادة المحاولة</button></div>';
    } else if (qz.phase === 'loading') {

    } else if (qz.phase === 'q') {
      var q = Q[qz.i], pick = qz.picks[qz.i], answered = pick !== undefined;
      body = '<div class="q" dir="ltr" lang="en"><p class="q-text">' + (qz.i + 1) + '. ' + esc(q.q) + '</p><div class="opts">' +
        q.o.map(function (t, oi) {
          var cls = 'opt', k = String.fromCharCode(65 + oi);
          if (answered) {
            if (oi === q.a) { cls += ' right'; k = I.check; }
            else if (oi === pick) cls += ' wrong';
            else cls += ' dim';
          }
          return '<button class="' + cls + '" type="button" data-o="' + oi + '"' + (answered ? ' disabled' : '') + '><span class="k">' + k + '</span><span>' + esc(t) + '</span></button>';
        }).join('') + '</div></div>';
      if (answered) {
        body += '<p class="why"><b>' + (pick === q.a ? 'إجابة صحيحة. ' : 'إجابة غير صحيحة. ') + '</b>' + esc(q.why) + '</p>' +
          '<button class="btn primary next" type="button" data-act="qnext">' + (qz.i < Q.length - 1 ? 'السؤال التالي' : 'عرض النتيجة') + '</button>';
      }

      var msg = score === Q.length ? 'ممتاز، فهمت السلايد كاملاً.' : (score >= 2 ? 'جيد. راجع المصطلحات اللي أخطأت فيها.' : 'راجع السلايد وجرّب مرة ثانية.');

  function chBase() { return (inkUI.focus ? 130 : 230) + (inkUI.on ? 80 : 0); }
  // on wide screens the floating translation card sits at the bottom; if it would cover the study buttons,

  function fitSide() {

  }
  function paintSide() {

    side.classList.toggle('static', S.mode !== 'tr');

  function selectTerm(el) {

    S.selKey = el.dataset.k || el.dataset.x; S.selText = el.textContent || S.selKey; S.aiErr = '';

  }
  function pwCheck(pw) {
    if (pw.length < 8) return 'كلمة السر لازم تكون 8 خانات على الأقل.';
    if (!/^[\x21-\x7E]+$/.test(pw)) return 'كلمة السر بالإنجليزي فقط (حروف وأرقام ورموز)، بدون عربي أو مسافات.';
    if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) return 'كلمة السر لازم فيها حروف إنجليزية وأرقام.';
    return '';
  }
  function aiMsg(r, dflt) {
    var st = r && r.error && r.error.context && r.error.context.status;
    if (st === 402) { subscribed = false; plan = null; trial = null; return 'أسئلة الذكاء الاصطناعي للمشتركين فقط.'; }
    if (st === 429) return 'وصلت للحد اليومي. جرّب بكرة.';

    return dflt;
  }
  function aiKey(k) { return cur().field + '|' + (subscribed ? 'm' : 't') + '|' + k; }
  function termData() { return curSlide().terms[S.selKey] || aiCache[aiKey(S.selKey)] || null; }
  function aiTranslate(key, text, ctx, tries) {
    var ck = aiKey(key), co = cur();
    if (aiCache[ck]) return;
    tries = tries || 0; S.trArgs = [key, text, ctx];
    function fail(m, r) {
      var st = r && r.error && r.error.context && r.error.context.status;
      if (tries < 1 && st !== 429 && st !== 401 && st !== 402) { setTimeout(function () { if (view === 'study' && S && S.selKey === key) aiTranslate(key, text, ctx, tries + 1); }, 500); return; }
      if (view === 'study' && S && S.selKey === key) { S.aiErr = m; paintSide(); }
    }
    if (!sb) return fail('الخدمة غير متاحة الآن.');
    sb.functions.invoke('ai', { body: { task: 'translate', text: text, ctx: ctx, field: co.field, course: co.name } }).then(function (r) {
      var v = r && r.data && r.data.data;
      if (v && v.ar) { aiCache[ck] = [String(v.ar), String(v.mean || '')]; if (view === 'study' && S && S.selKey === key) paintSide(); }
      else fail(aiMsg(r, 'ما قدرت أترجم الكلمة. جرّب مرة ثانية.'), r);
    }, function () { fail('ما قدرت أترجم الكلمة. جرّب مرة ثانية.'); });
  }

  function toggleSave() {

    else { saved.push({ id: id, en: S.selText, ar: d[0], mean: subscribed ? d[1] : '', cid: cur().id }); toast('تم حفظ الكلمة في كلماتي.'); }

  function startScan() {

  }

  function startQuiz() {

    $('#side').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    clearTimeout(S.quizTimer);

  function aiQuiz(q, sl) {
